<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boolean Logic Pro | Calculator & Minimizer</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Vis.js for Circuit Rendering -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo"><i class="fas fa-microchip"></i> Boolean Logic Pro</div>
        <nav>
            <a href="#" class="active">Calculator</a>
            <a href="https://github.com" target="_blank">Documentation</a>
        </nav>
    </header>

    <main class="container">
        <!-- LEFT PANEL: INPUTS -->
        <section class="panel input-panel">
            <h2><i class="fas fa-keyboard"></i> Input Function</h2>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('expr')">Expression</button>
                <button class="tab-btn" onclick="switchTab('minterm')">Minterms</button>
                <button class="tab-btn" onclick="switchTab('truthtable')">Truth Table</button>
            </div>

            <!-- Tab 1: Boolean Expression -->
            <div id="tab-expr" class="tab-content active">
                <label>Enter Boolean Expression:</label>
                <p class="hint">Use A-F. Operators: AND (*), OR (+), NOT ('), XOR (^). Example: A*B + C'</p>
                <input type="text" id="bool-expr" placeholder="e.g., A*B + C'">
            </div>

            <!-- Tab 2: Minterms/Maxterms -->
            <div id="tab-minterm" class="tab-content">
                <label>Variables (Max 6):</label>
                <select id="var-count">
                    <option value="2">2 (A, B)</option>
                    <option value="3" selected>3 (A, B, C)</option>
                    <option value="4">4 (A, B, C, D)</option>
                    <option value="5">5 (A, B, C, D, E)</option>
                    <option value="6">6 (A, B, C, D, E, F)</option>
                </select>
                <label>Type:</label>
                <select id="term-type">
                    <option value="m">Minterms ∑m</option>
                    <option value="M">Maxterms ∏M</option>
                </select>
                <label>Values (comma separated):</label>
                <input type="text" id="term-values" placeholder="e.g., 0, 1, 3, 7">
            </div>

            <!-- Tab 3: Truth Table Input -->
            <div id="tab-truthtable" class="tab-content">
                <label>Variables:</label>
                <select id="tt-var-count" onchange="generateInputTT()">
                    <option value="2">2 (A, B)</option>
                    <option value="3" selected>3 (A, B, C)</option>
                    <option value="4">4 (A, B, C, D)</option>
                </select>
                <div class="tt-scroll">
                    <table id="input-tt">
                        <!-- Generated via JS -->
                    </table>
                </div>
            </div>

            <button class="generate-btn" onclick="processInput()">Generate Logic <i class="fas fa-arrow-right"></i></button>
            <div id="error-msg" class="error"></div>
        </section>

        <!-- RIGHT PANEL: OUTPUTS -->
        <section class="panel output-panel" style="display: none;" id="output-section">
            <h2><i class="fas fa-poll-h"></i> Results</h2>
            
            <div class="result-box">
                <h3>Simplified Expression (SOP)</h3>
                <div class="expression-display" id="simplified-expr">---</div>
            </div>

            <div class="output-tabs">
                <button class="out-tab-btn active" onclick="switchOutTab('circuits')">Circuits</button>
                <button class="out-tab-btn" onclick="switchOutTab('tt')">Truth Table & Verification</button>
            </div>

            <!-- Output: Circuits -->
            <div id="out-circuits" class="out-tab-content active">
                <div class="circuit-subtabs">
                    <button class="c-tab-btn active" onclick="drawCircuitType('basic')">Basic Gates</button>
                    <button class="c-tab-btn" onclick="drawCircuitType('nand')">NAND Only</button>
                    <button class="c-tab-btn" onclick="drawCircuitType('nor')">NOR Only</button>
                </div>
                <!-- Circuit Diagram Container (Scrollable) -->
                <div class="circuit-container" id="circuit-canvas"></div>
            </div>

            <!-- Output: Truth Table -->
            <div id="out-tt" class="out-tab-content">
                <p class="hint">This verifies that the Original, Simplified, NAND, and NOR circuits produce <strong>identical</strong> outputs.</p>
                <div class="tt-scroll">
                    <table id="output-tt"></table>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
